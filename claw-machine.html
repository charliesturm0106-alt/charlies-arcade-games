<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🕹️ Claw Machine · Neon District</title><link rel="stylesheet" href="game-pack-2.css"><link rel="stylesheet" href="arcade-polish.css"></head><body><main><a href="index.html">← Neon District</a><div class="head"><div><h1>🕹️ Claw Machine</h1><p>Line up the claw, drop it, and grab the highest-value prizes.</p></div><span class="badge">ARCADE · SKILL</span></div><div class="difficulty"><button data-diff="rookie">ROOKIE</button><button data-diff="pro">PRO</button><button data-diff="hard">HARD</button><button data-diff="legend">LEGEND</button></div><div class="hud"><div class="box"><span>SCORE</span><strong id="score">0</strong></div><div class="box"><span>LEVEL</span><strong id="round">1</strong></div><div class="box"><span>STREAK</span><strong id="streak">0</strong></div><div class="box"><span>BEST</span><strong id="best">0</strong></div></div><div class="statusline" id="status"></div><div class="stage"><canvas id="game" width="640" height="600"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="title">🕹️ Claw Machine</h2><p id="msg">Line up the claw, drop it, and grab the highest-value prizes.</p><button id="start">PLAY 2.0</button></div></div></div><div class="controls"><button id="left">◀ MOVE</button><button id="action">DROP</button><button id="right">MOVE ▶</button></div><div class="actions"><button id="restart">RESTART</button></div><p class="help">Hold left/right to move · Space = drop.</p></main><script>(()=>{const C=document.getElementById('game'),c=C.getContext('2d'),$=id=>document.getElementById(id);const cfg={rookie:{speed:120,tol:42,tries:12},pro:{speed:155,tol:34,tries:10},hard:{speed:185,tol:27,tries:9},legend:{speed:220,tol:21,tries:8}};let diff=localStorage.nd_claw_diff||'pro',on=false,score=0,tries=0,streak=0,best=+(localStorage.nd_claw||0),x=320,y=95,state='idle',grab=null,dir=0,prizes=[];function conf(){return cfg[diff]}function makePrizes(){prizes=[];for(let i=0;i<7;i++)prizes.push({x:95+i*75+Math.random()*18,y:500-Math.random()*65,val:[50,75,100,150,200][Math.floor(Math.random()*5)],taken:false})}function hud(){$('score').textContent=score;$('round').textContent=tries+'/'+conf().tries;$('streak').textContent=streak;$('best').textContent=best;$('status').textContent=state==='idle'?'MOVE · DROP WHEN LINED UP':state==='down'?'CLAW DROPPING':'LIFTING';if(score>best){best=score;localStorage.nd_claw=best;$('best').textContent=best}}function setDiff(d){diff=d;localStorage.nd_claw_diff=d;document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('active',b.dataset.diff===d))}function reset(){on=true;score=0;tries=0;streak=0;x=320;y=95;state='idle';grab=null;dir=0;makePrizes();$('overlay').classList.add('hide');hud()}function end(){on=false;$('overlay').classList.remove('hide');$('title').textContent='PRIZE RUN COMPLETE';$('msg').textContent='Score '+score+' · Best '+best;$('start').textContent='PLAY AGAIN';hud()}function drop(){if(on&&state==='idle'){state='down';grab=null;hud()}}function update(dt){if(!on)return;if(state==='idle'){x=Math.max(45,Math.min(595,x+dir*conf().speed*dt))}else if(state==='down'){y+=260*dt;if(y>=455){y=455;let bestP=null,bd=999;for(const p of prizes){if(!p.taken){const d=Math.abs(p.x-x);if(d<bd){bd=d;bestP=p}}}if(bestP&&bd<=conf().tol){grab=bestP;grab.taken=true;streak++;score+=grab.val+streak*10}else streak=0;state='up'}}else if(state==='up'){y-=285*dt;if(grab){grab.x=x;grab.y=y+45}if(y<=95){y=95;tries++;grab=null;state='idle';if(tries>=conf().tries||prizes.every(p=>p.taken)){end();return}}}hud()}function draw(){c.fillStyle='#081019';c.fillRect(0,0,640,600);c.fillStyle='#182433';c.fillRect(40,55,560,490);c.fillStyle='#2b3b4d';c.fillRect(45,430,550,115);for(const p of prizes){if(!p.taken||p===grab){c.fillStyle=p.val>=150?'#ffd45f':p.val>=100?'#65e69c':'#55dfff';c.beginPath();c.arc(p.x,p.y,22,0,Math.PI*2);c.fill();c.fillStyle='#07101a';c.font='900 10px system-ui';c.textAlign='center';c.fillText('$'+p.val,p.x,p.y+4)}}c.strokeStyle='#c7d4e2';c.lineWidth=4;c.beginPath();c.moveTo(x,55);c.lineTo(x,y);c.stroke();c.fillStyle='#d9e2eb';c.fillRect(x-24,y,48,16);c.strokeStyle='#d9e2eb';c.beginPath();c.moveTo(x-20,y+16);c.lineTo(x-34,y+45);c.moveTo(x+20,y+16);c.lineTo(x+34,y+45);c.stroke();c.fillStyle='#9cb0c5';c.font='900 13px system-ui';c.textAlign='center';c.fillText('TRIES '+tries+'/'+conf().tries+' · LINE UP THE CLAW',320,30)}function bindHold(btn,value){btn.onpointerdown=e=>{e.preventDefault();dir=value};const stop=()=>{if(dir===value)dir=0};btn.onpointerup=stop;btn.onpointercancel=stop;btn.onpointerleave=stop}bindHold($('left'),-1);bindHold($('right'),1);$('action').onclick=drop;$('start').onclick=$('restart').onclick=reset;addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')dir=-1;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')dir=1;if(e.code==='Space'){e.preventDefault();drop()}});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a'){if(dir<0)dir=0}if(e.key==='ArrowRight'||e.key.toLowerCase()==='d'){if(dir>0)dir=0}});document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{if(!on){setDiff(b.dataset.diff);hud()}});let last=0;function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}setDiff(diff);hud();requestAnimationFrame(loop)})();</script><script src="arcade-polish.js"></script></body></html>
