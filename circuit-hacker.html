<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🧠 Circuit Hacker · Neon District</title><link rel="stylesheet" href="game-pack-2.css"><link rel="stylesheet" href="arcade-polish.css"></head><body><main><a href="index.html">← Neon District</a><div class="head"><div><h1>🧠 Circuit Hacker</h1><p>Memorize node sequences and break deeper into the grid.</p></div><span class="badge">CHILL · PUZZLE</span></div><div class="difficulty"><button data-diff="rookie">ROOKIE</button><button data-diff="pro">PRO</button><button data-diff="hard">HARD</button><button data-diff="legend">LEGEND</button></div><div class="hud"><div class="box"><span>SCORE</span><strong id="score">0</strong></div><div class="box"><span>LEVEL</span><strong id="round">1</strong></div><div class="box"><span>STREAK</span><strong id="streak">0</strong></div><div class="box"><span>BEST</span><strong id="best">0</strong></div></div><div class="statusline" id="status"></div><div class="stage"><canvas id="game" width="640" height="600"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="title">🧠 Circuit Hacker</h2><p id="msg">Memorize node sequences and break deeper into the grid.</p><button id="start">PLAY 2.0</button></div></div></div><div class="actions"><button id="restart">RESTART</button></div><p class="help">Tap the grid · Keyboard 1–9 also works.</p></main><script>(()=>{const C=document.getElementById('game'),c=C.getContext('2d'),$=id=>document.getElementById(id);const cfg={rookie:{start:3,flash:.58,lives:4},pro:{start:4,flash:.46,lives:3},hard:{start:5,flash:.36,lives:3},legend:{start:6,flash:.28,lives:2}};let diff=localStorage.nd_circuit_diff||'pro',on=false,score=0,level=1,streak=0,best=+(localStorage.nd_circuit||0),lives=3,seq=[],input=0,showIndex=-1,timer=0,phase='ready';function conf(){return cfg[diff]}function hud(){$('score').textContent=score;$('round').textContent=level;$('streak').textContent=streak;$('best').textContent=best;$('status').textContent='LIVES '+lives+' · '+(phase==='show'?'WATCH':phase==='input'?'REPEAT '+input+'/'+seq.length:'READY');if(score>best){best=score;localStorage.nd_circuit=best;$('best').textContent=best}}function setDiff(d){diff=d;localStorage.nd_circuit_diff=d;document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('active',b.dataset.diff===d))}function makeSeq(){seq=[];for(let i=0;i<conf().start+level-1;i++)seq.push(Math.floor(Math.random()*9));input=0;showIndex=-1;phase='show';timer=.35;hud()}function reset(){on=true;score=0;level=1;streak=0;lives=conf().lives;$('overlay').classList.add('hide');makeSeq()}function end(){on=false;phase='over';$('overlay').classList.remove('hide');$('title').textContent='SYSTEM LOCKED';$('msg').textContent='Score '+score+' · Best '+best;$('start').textContent='HACK AGAIN';hud()}function tap(i){if(!on||phase!=='input')return;if(seq[input]===i){score+=100+level*20+streak*5;streak++;input++;if(input>=seq.length){level++;score+=250;phase='clear';setTimeout(()=>{if(on)makeSeq()},250)}}else{lives--;streak=0;if(lives<=0){end();return}input=0;phase='show';showIndex=-1;timer=.6}hud()}function update(dt){if(!on||phase!=='show')return;timer-=dt;if(timer<=0){showIndex++;if(showIndex>=seq.length){phase='input';showIndex=-1;hud()}else timer=conf().flash}}function draw(){c.fillStyle='#070d16';c.fillRect(0,0,640,600);c.fillStyle='#0f1a27';c.fillRect(65,65,510,510);const cols=['#ff5f72','#55dfff','#65e69c','#ffd45f','#9b7bff','#ff8f5a','#63e8d5','#f26bd1','#b9e95c'];for(let i=0;i<9;i++){const x=105+(i%3)*160,y=105+Math.floor(i/3)*160,lit=phase==='show'&&showIndex>=0&&seq[showIndex]===i;c.fillStyle=lit?cols[i]:'#182536';c.fillRect(x,y,110,110);c.strokeStyle=lit?'#fff':'#2a3c51';c.lineWidth=lit?5:2;c.strokeRect(x,y,110,110);c.fillStyle=lit?'#07101a':'#8da0b6';c.font='900 24px system-ui';c.textAlign='center';c.fillText(String(i+1),x+55,y+66)}c.fillStyle='#9ab0c6';c.font='900 13px system-ui';c.fillText(phase==='show'?'MEMORIZE THE SEQUENCE':phase==='input'?'TAP THE NODES IN ORDER':'CIRCUIT HACKER',320,35)}C.addEventListener('pointerdown',e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*640,y=(e.clientY-r.top)/r.height*600;for(let i=0;i<9;i++){const bx=105+(i%3)*160,by=105+Math.floor(i/3)*160;if(x>=bx&&x<=bx+110&&y>=by&&y<=by+110){tap(i);break}}});addEventListener('keydown',e=>{const n=Number(e.key);if(n>=1&&n<=9)tap(n-1)});$('start').onclick=$('restart').onclick=reset;document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{if(!on){setDiff(b.dataset.diff);hud()}});let last=0;function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}setDiff(diff);hud();requestAnimationFrame(loop)})();</script><script src="arcade-polish.js"></script></body></html>
