<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🎵 Beat Tiles · Neon District</title><link rel="stylesheet" href="game-pack-2.css"></head><body><main><a href="index.html">← Neon District</a><div class="head"><div><h1>🎵 Beat Tiles</h1><p>Switch lanes and hit falling tiles exactly on the timing line.</p></div><span class="badge">ARCADE · RHYTHM</span></div><div class="difficulty"><button data-diff="rookie">ROOKIE</button><button data-diff="pro">PRO</button><button data-diff="hard">HARD</button><button data-diff="legend">LEGEND</button></div><div class="hud"><div class="box"><span>SCORE</span><strong id="score">0</strong></div><div class="box"><span>LEVEL</span><strong id="round">1</strong></div><div class="box"><span>STREAK</span><strong id="streak">0</strong></div><div class="box"><span>BEST</span><strong id="best">0</strong></div></div><div class="statusline" id="status"></div><div class="stage"><canvas id="game" width="640" height="600"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="title">🎵 Beat Tiles</h2><p id="msg">Switch lanes and hit falling tiles exactly on the timing line.</p><button id="start">PLAY 2.0</button></div></div></div><div class="controls"><button id="left">◀ LANE</button><button id="action">HIT</button><button id="right">LANE ▶</button></div><div class="actions"><button id="restart">RESTART</button></div><p class="help">← → / A D select lane · Space/Enter hits.</p></main><script>(()=>{const C=document.getElementById('game'),c=C.getContext('2d'),$=id=>document.getElementById(id);const cfg={rookie:{speed:150,spawn:.75,window:42,time:40},pro:{speed:185,spawn:.62,window:34,time:35},hard:{speed:225,spawn:.52,window:27,time:32},legend:{speed:270,spawn:.44,window:22,time:30}};let diff=localStorage.nd_beat_diff||'pro',on=false,score=0,round=1,streak=0,best=+(localStorage.nd_beat||0),lane=1,t=0,left=35,notes=[],spawnClock=0;function conf(){return cfg[diff]}function hud(){$('score').textContent=score;$('round').textContent=round;$('streak').textContent=streak;$('best').textContent=best;$('status').textContent='TIME '+Math.max(0,left).toFixed(1)+' · LANE '+(lane+1);if(score>best){best=score;localStorage.nd_beat=best;$('best').textContent=best}}function setDiff(d){diff=d;localStorage.nd_beat_diff=d;document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('active',b.dataset.diff===d))}function reset(){on=true;score=0;streak=0;t=0;round=1;lane=1;left=conf().time;notes=[];spawnClock=0;$('overlay').classList.add('hide');hud()}function end(){on=false;$('overlay').classList.remove('hide');$('title').textContent='TRACK COMPLETE';$('msg').textContent='Score '+score+' · Best '+best;$('start').textContent='PLAY AGAIN';hud()}function move(d){if(on){lane=Math.max(0,Math.min(3,lane+d));hud()}}function hit(){if(!on)return;let bestN=null,bd=999;for(const n of notes){if(!n.hit&&n.lane===lane){const d=Math.abs(n.y-500);if(d<bd){bd=d;bestN=n}}}if(bestN&&bd<=conf().window){bestN.hit=true;score+=bd<conf().window*.35?150+streak*12:100+streak*8;streak++}else{streak=0;score=Math.max(0,score-25)}hud()}function update(dt){if(!on)return;t+=dt;left-=dt;round=1+Math.floor((conf().time-left)/8);if(left<=0){end();return}spawnClock-=dt;if(spawnClock<=0){notes.push({lane:Math.floor(Math.random()*4),y:-30,hit:false});spawnClock=conf().spawn*(.85+Math.random()*.3)}const speed=conf().speed*(1+(round-1)*.05);for(const n of notes)n.y+=speed*dt;for(const n of notes){if(!n.hit&&n.y>540){n.hit=true;streak=0}}notes=notes.filter(n=>n.y<620&&!n.hit);hud()}function draw(){c.fillStyle='#07101a';c.fillRect(0,0,640,600);for(let i=0;i<4;i++){c.fillStyle=i===lane?'#132b3d':'#0e1925';c.fillRect(80+i*120,0,110,600);c.strokeStyle='#24384c';c.strokeRect(80+i*120,0,110,600)}c.fillStyle='#ffffff22';c.fillRect(70,492,500,16);const cs=['#ff5f72','#55dfff','#65e69c','#ffd45f'];for(const n of notes){c.fillStyle=cs[n.lane];c.fillRect(98+n.lane*120,n.y,74,24)}c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(80+lane*120,470,110,60);c.fillStyle='#fff';c.font='900 13px system-ui';c.textAlign='center';c.fillText('HIT THE TILES ON THE WHITE LINE',320,28)}$('start').onclick=$('restart').onclick=reset;$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);$('action').onclick=hit;document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{if(!on){setDiff(b.dataset.diff);hud()}});addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')move(-1);if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')move(1);if(e.code==='Space'||e.key==='Enter'){e.preventDefault();hit()}});let last=0;function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop)}setDiff(diff);hud();requestAnimationFrame(loop)})();</script></body></html>
