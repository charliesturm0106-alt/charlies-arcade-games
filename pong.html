<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090d19"><title>Pong Arena · Neon District</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263a77,#080b15 60%);color:#f7f9ff;font-family:Inter,system-ui,sans-serif;display:flex;justify-content:center;padding:16px 12px}main{width:min(100%,650px)}a{color:#adb9d6;text-decoration:none;font-size:12px;font-weight:900}.head{margin:10px 0}.head h1{margin:6px 0 2px;font-size:30px;letter-spacing:-1px}.sub{margin:0;color:#8896b4;font-size:11px}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.box{background:#101624;border:1px solid #2b3954;border-radius:13px;padding:9px}.box span{display:block;color:#7f8da8;font-size:8px;font-weight:950}.box strong{font-size:17px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}.toolbar button,.actions button,.controls button{border:1px solid #34435f;background:#141c2b;color:#eef2ff;border-radius:11px;padding:9px 11px;font-size:10px;font-weight:950}.toolbar button.active{background:linear-gradient(90deg,#5f77ff,#60d8ff);color:#07101a}.stage{position:relative;width:min(100%,500px);margin:auto;border-radius:22px;overflow:hidden;border:1px solid #3b4b69;box-shadow:0 24px 70px #0008}canvas{display:block;width:100%;height:auto;background:#070a12;touch-action:none}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#070a12db;backdrop-filter:blur(6px);padding:22px;text-align:center}.overlay[hidden]{display:none}.panel{width:min(100%,360px);background:#111827ed;border:1px solid #3b4b69;border-radius:18px;padding:20px}.panel h2{margin:0 0 7px;font-size:27px}.panel p{margin:0 0 16px;color:#98a6bb;font-size:11px;line-height:1.5}.primary{width:100%;border:0;border-radius:12px;padding:12px;background:linear-gradient(90deg,#6e70ff,#52d9ff);color:#06101a;font-weight:1000}.actions,.controls{display:flex;gap:8px;width:min(100%,500px);margin:9px auto}.actions button,.controls button{flex:1}.controls button{height:54px;font-size:20px;touch-action:none}.help{text-align:center;color:#77859f;font-size:10px}@media(min-width:760px){.controls{display:none}}@media(max-width:520px){.hud{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="arcade-polish.css"></head><body><main><a href="index.html">← Arcade 2.0</a><div class="head"><h1>🏓 Pong Arena</h1><p class="sub">First to 7. Four CPU levels, rally speed-ups, and a charged smash.</p></div><div class="hud"><div class="box"><span>YOU</span><strong id="you">0</strong></div><div class="box"><span>CPU</span><strong id="cpu">0</strong></div><div class="box"><span>RALLY</span><strong id="rally">0</strong></div><div class="box"><span>BEST WIN</span><strong id="wins">0</strong></div></div><div class="toolbar" id="levels"><button data-level="easy">Easy</button><button data-level="normal" class="active">Normal</button><button data-level="hard">Hard</button><button data-level="legend">Legend</button><button id="soundBtn">Sound: On</button></div><div class="stage"><canvas id="game" width="500" height="600"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="title">Pong Arena</h2><p id="message">Move with A/D, arrows, drag, or touch buttons. Build a rally to charge your smash.</p><button class="primary" id="start">START MATCH</button></div></div></div><div class="actions"><button id="pause">Pause</button><button id="smash">SMASH 0%</button><button id="restart">Restart</button></div><div class="controls"><button id="left">◀</button><button id="right">▶</button></div><p class="help">Smash becomes available at 100% after long rallies. P pauses.</p></main><script>
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id),W=500,H=600,PW=105,PH=13;let px=198,cx=198,bx=250,by=300,vx=220,vy=260,ps=0,cs=0,rally=0,charge=0,state='ready',level='normal',last=0,left=false,right=false,sound=true,audio=null,wins=+(localStorage.getItem('hs_pong')||0);
const levels={easy:{cpu:190,err:55},normal:{cpu:250,err:34},hard:{cpu:320,err:18},legend:{cpu:390,err:8}};
function beep(f=420){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.025;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.05);o.stop(audio.currentTime+.06)}catch(e){}}
function hud(){$('you').textContent=ps;$('cpu').textContent=cs;$('rally').textContent=rally;$('wins').textContent=wins;$('smash').textContent='SMASH '+Math.floor(charge)+'%'}
function resetBall(d=1){bx=W/2;by=H/2;const a=(Math.random()*.5-.25);const sp=275;vx=Math.sin(a)*sp;vy=d*Math.cos(a)*sp;rally=0;charge=0;hud()}
function start(){px=cx=(W-PW)/2;ps=cs=0;resetBall(Math.random()<.5?1:-1);state='play';$('overlay').hidden=true;last=performance.now()}
function finish(win){state='over';if(win){wins++;localStorage.setItem('hs_pong',wins)}hud();$('title').textContent=win?'You win!':'CPU wins';$('message').textContent='Final '+ps+'–'+cs+' · career wins '+wins+'.';$('start').textContent='PLAY AGAIN';$('overlay').hidden=false}
function pause(){if(state==='play'){state='pause';$('title').textContent='Paused';$('message').textContent='Match paused.';$('start').textContent='RESUME';$('overlay').hidden=false}else if(state==='pause'){state='play';$('overlay').hidden=true;last=performance.now()}}
function score(player){player?ps++:cs++;hud();beep(player?720:170);if(ps>=7||cs>=7){finish(ps>cs);return}resetBall(player?1:-1)}
function update(dt){const cfg=levels[level];if(left)px-=360*dt;if(right)px+=360*dt;px=Math.max(0,Math.min(W-PW,px));const target=bx-PW/2+(Math.sin(performance.now()/700)*cfg.err);const d=target-cx;cx+=Math.max(-cfg.cpu*dt,Math.min(cfg.cpu*dt,d));cx=Math.max(0,Math.min(W-PW,cx));bx+=vx*dt;by+=vy*dt;if(bx<8||bx>W-8){bx=Math.max(8,Math.min(W-8,bx));vx*=-1;beep(300)}if(vy>0&&by>=H-47&&by<=H-28&&bx>=px&&bx<=px+PW){by=H-48;const off=(bx-(px+PW/2))/(PW/2);vx+=off*130;vy=-Math.abs(vy)*1.035;rally++;charge=Math.min(100,charge+16);beep(560);hud()}if(vy<0&&by<=47&&by>=28&&bx>=cx&&bx<=cx+PW){by=48;const off=(bx-(cx+PW/2))/(PW/2);vx+=off*105;vy=Math.abs(vy)*1.03;rally++;charge=Math.min(100,charge+10);beep(500);hud()}const max=520,s=Math.hypot(vx,vy);if(s>max){vx*=max/s;vy*=max/s}if(by>H+20)score(false);if(by<-20)score(true)}
function draw(){x.fillStyle='#070a12';x.fillRect(0,0,W,H);x.strokeStyle='#233149';x.setLineDash([10,12]);x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();x.setLineDash([]);x.fillStyle='#74dfff';x.fillRect(px,H-42,PW,PH);x.fillStyle='#8c7dff';x.fillRect(cx,29,PW,PH);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,8,0,Math.PI*2);x.fill()}
function frame(n){const dt=Math.min(.04,(n-last)/1000);last=n;if(state==='play')update(dt);draw();requestAnimationFrame(frame)}
function hold(id,key){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(key==='l')left=true;else right=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{if(key==='l')left=false;else right=false}))}hold('left','l');hold('right','r');c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){const r=c.getBoundingClientRect();px=Math.max(0,Math.min(W-PW,(e.clientX-r.left)*W/r.width-PW/2))}});document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')left=true;if(k==='d'||k==='arrowright')right=true;if(k==='p')pause();if(k===' ')useSmash()});document.addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='arrowleft')left=false;if(k==='d'||k==='arrowright')right=false});
function useSmash(){if(state!=='play'||charge<100)return;const sign=vy>0?-1:1;vy=sign*Math.max(430,Math.abs(vy)*1.25);vx*=1.12;charge=0;beep(920);hud()}$('smash').onclick=useSmash;$('levels').onclick=e=>{const b=e.target.closest('[data-level]');if(!b||state==='play')return;level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(q=>q.classList.toggle('active',q===b))};$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent='Sound: '+(sound?'On':'Off')};$('start').onclick=()=>state==='pause'?pause():start();$('pause').onclick=pause;$('restart').onclick=start;window.addEventListener('blur',()=>{left=right=false;if(state==='play')pause()});hud();draw();requestAnimationFrame(frame);
</script><script src="arcade-polish.js"></script></body></html>
