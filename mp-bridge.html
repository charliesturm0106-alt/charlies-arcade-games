<!doctype html>
<html><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Arcade City Bridge</title></head>
<body><script>
(()=>{
'use strict';
const PARENT='https://charliesturm0106-alt.github.io';
let token='',pending=null,closed=false,poll=null,failures=0,started=false;
function uuid(){
 if(globalThis.crypto?.randomUUID)return crypto.randomUUID();
 const a=new Uint8Array(16);crypto.getRandomValues(a);a[6]=(a[6]&15)|64;a[8]=(a[8]&63)|128;
 const h=[...a].map(v=>v.toString(16).padStart(2,'0')).join('');
 return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
function post(type,extra={}){parent.postMessage({arcadeBridge:true,type,...extra},PARENT)}
async function exchange(message){
 if(closed)return;
 const controller=typeof AbortController==='function'?new AbortController():null;
 const timeout=controller?setTimeout(()=>controller.abort(),7000):null;
 try{
  const opts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,message}),cache:'no-store'};
  if(controller)opts.signal=controller.signal;
  const r=await fetch('/mp/exchange',opts);if(!r.ok)throw new Error('HTTP '+r.status);
  const body=await r.json();failures=0;
  for(const m of body.messages||[])post('message',{message:m});
 }catch(e){
  failures++;
  if(failures>=5){post('error',{message:'Live city connection failed'});closed=true;return}
 }finally{if(timeout)clearTimeout(timeout)}
 if(!closed)poll=setTimeout(()=>{const next=pending;pending=null;exchange(next)},failures?900:150);
}
window.addEventListener('message',e=>{
 if(e.origin!==PARENT||!e.data||e.data.arcadeBridge!==true)return;
 const d=e.data;
 if(d.type==='connect'&&!started){started=true;token=uuid();exchange(d.initial)}
 else if(d.type==='send'&&!closed){pending=d.message}
 else if(d.type==='close'){closed=true;clearTimeout(poll);if(token)fetch('/mp/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,message:{type:'leave'}}),keepalive:true}).catch(()=>{})}
});
post('ready');
})();
</script></body></html>
