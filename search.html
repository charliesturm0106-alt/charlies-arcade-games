<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Search · Charlie's Arcade</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#edf6ff;background:#080e18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#152a43,transparent 55%);min-height:100vh}main{max-width:900px;margin:auto;padding:32px 22px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}nav a{color:#b6c9dd;text-decoration:none;font-weight:700}.brand{color:#63dfbd;font-size:13px;letter-spacing:1px}h1{font-size:clamp(36px,7vw,58px);letter-spacing:-2px;margin:0 0 12px}p{color:#a1b3c9;line-height:1.6}form{display:flex;gap:10px;margin:28px 0 18px}input{min-width:0;flex:1;background:#111d2e;border:1px solid #39516b;color:#fff;border-radius:14px;padding:17px;font:inherit;outline:none}input:focus{border-color:#65dfc2;box-shadow:0 0 0 3px #65dfc21a}button{border:0;border-radius:14px;padding:16px 25px;background:#65dfc2;color:#071a1b;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{min-height:26px;color:#b7c8da;font-size:14px}.result{padding:22px;margin-top:14px;border:1px solid #283d53;border-radius:16px;background:#101b2be0}.result small{color:#77e0c8;overflow-wrap:anywhere}.result h2{font-size:20px;line-height:1.35;margin:9px 0}.result a{color:#dfefff;text-decoration:none}.result a:hover{text-decoration:underline}.result p{font-size:14px;margin:0;overflow-wrap:anywhere}footer{margin-top:46px;border-top:1px solid #213349;padding-top:18px;color:#71869e;font-size:12px}@media(max-width:500px){nav{margin-bottom:50px}form{flex-direction:column}button{width:100%}}
</style></head><body><main><nav><a href="index.html">← Back to the arcade</a><span class="brand">CHARLIE'S ARCADE</span></nav><h1>Search the web.</h1><p>Look something up without leaving the arcade. Choose a result to open its website.</p><form id="form"><input id="query" type="search" maxlength="200" placeholder="What are you looking for?" aria-label="Search the web" required><button id="submit" type="submit">Search</button></form><div id="status" role="status" aria-live="polite">Results appear here.</div><section id="results" aria-label="Search results"></section><footer>Search results from Bing RSS. Website links open in a new tab.</footer></main>
<script>
const endpoint=location.hostname.endsWith('github.io')?'https://xml-both-arrangement-optics.trycloudflare.com/web-search':'/web-search';
const form=document.querySelector('#form'),input=document.querySelector('#query'),button=document.querySelector('#submit'),status=document.querySelector('#status'),box=document.querySelector('#results');
form.addEventListener('submit',async event=>{event.preventDefault();const q=input.value.trim();if(!q)return;button.disabled=true;status.textContent='Searching…';box.replaceChildren();try{const response=await fetch(endpoint+'?q='+encodeURIComponent(q),{signal:AbortSignal.timeout(30000),cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Search failed.');for(const item of data.results){const article=document.createElement('article');article.className='result';const domain=document.createElement('small');domain.textContent=new URL(item.url).hostname;const h=document.createElement('h2'),a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title;h.append(a);const text=document.createElement('p');text.textContent=item.description;article.append(domain,h,text);box.append(article)}status.textContent=data.results.length?data.results.length+' results for “'+q+'”':'No results found. Try different words.'}catch(error){status.textContent=error.name==='TimeoutError'?'Search took too long. Please try again.':error.message==='Failed to fetch'?'Search is unavailable right now. Please try again later.':error.message}finally{button.disabled=false}});
</script></body></html>
