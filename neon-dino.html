<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Neon Dino Run</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Press Start 2P', sans-serif;
    background: linear-gradient(135deg, #000 0%, #001133 50%, #000 100%);
    background-size: 300% 300%;
    animation: bgMove 10s ease infinite;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  canvas {
    display: block;
    margin: auto;
    margin-top: 40px;
    background: transparent;
    border: 4px solid #0ff;
    box-shadow: 0 0 25px #0ff, 0 0 50px #0ff inset;
  }

  .score-box {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
  }

  .start-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    color: #0ff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-shadow: 0 0 10px #0ff;
    font-size: 12px;
  }

  .btn {
    margin-top: 10px;
    padding: 8px 14px;
    border: 2px solid #0ff;
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 10px #0ff;
    cursor: pointer;
    font-size: 10px;
  }

  .btn:hover {
    background: rgba(0,255,255,0.2);
  }
</style>
</head>

<body>

<div class="start-screen" id="startScreen">
  <h1>NEON DINO RUN</h1>
  <p>Press SPACE to jump</p>
  <p>Press START to begin</p>
  <div class="btn" id="startBtn">START</div>
</div>

<canvas id="game" width="900" height="300"></canvas>

<div class="score-box">
  Score: <span id="score">0</span>  
  | High Score: <span id="highscore">0</span>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;
let highscore = localStorage.getItem("hs_dino") || 0;
document.getElementById("highscore").innerText = highscore;

let running = false;

/* Neon Dino sprite (pixel art drawn manually) */
function drawDino(x, y, frame) {
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 20;

  ctx.fillStyle = "#0ff";

  // Body
  ctx.fillRect(0, 10, 40, 20);

  // Head
  ctx.fillRect(30, 0, 20, 20);

  // Eye
  ctx.fillStyle = "#f0f";
  ctx.fillRect(42, 6, 6, 6);

  ctx.fillStyle = "#0ff";

  // Legs (animated)
  if (frame % 20 < 10) {
    ctx.fillRect(5, 30, 10, 10);
    ctx.fillRect(25, 30, 10, 10);
  } else {
    ctx.fillRect(10, 30, 10, 10);
    ctx.fillRect(30, 30, 10, 10);
  }

  ctx.restore();
}

/* Neon cactus obstacle */
function drawCactus(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.shadowColor = "#f0f";
  ctx.shadowBlur = 20;
  ctx.fillStyle = "#f0f";

  ctx.fillRect(0, 0, 20, 40);
  ctx.fillRect(20, 10, 10, 20);
  ctx.fillRect(-10, 10, 10, 20);

  ctx.restore();
}

/* Parallax neon ground */
function drawGround() {
  ctx.strokeStyle = "#0ff";
  ctx.lineWidth = 3;
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 15;

  ctx.beginPath();
  ctx.moveTo(0, 250);
  ctx.lineTo(900, 250);
  ctx.stroke();
}

/* Game objects */
let dino = {
  x: 80,
  y: 200,
  dy: 0,
  jumping: false
};

let obstacles = [];
let frame = 0;

/* Game loop */
function update() {
  if (!running) return requestAnimationFrame(update);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  frame++;

  // Gravity
  dino.y += dino.dy;
  dino.dy += 0.6;

  // Ground collision
  if (dino.y > 200) {
    dino.y = 200;
    dino.dy = 0;
    dino.jumping = false;
  }

  drawGround();
  drawDino(dino.x, dino.y, frame);

  // Spawn cactus
  if (Math.random() < 0.02) {
    obstacles.push({ x: 900, y: 210 });
  }

  // Move + draw obstacles
  obstacles.forEach(o => {
    o.x -= 8;
    drawCactus(o.x, o.y);

    // Collision
    if (
      dino.x + 40 > o.x &&
      dino.x < o.x + 20 &&
      dino.y + 40 > o.y
    ) {
      running = false;
      localStorage.setItem("hs_dino", highscore);
      document.getElementById("startScreen").style.display = "flex";
    }
  });

  // Remove off-screen obstacles
  obstacles = obstacles.filter(o => o.x > -50);

  // Score
  score++;
  document.getElementById("score").innerText = score;

  if (score > highscore) {
    highscore = score;
    document.getElementById("highscore").innerText = highscore;
  }

  requestAnimationFrame(update);
}

/* Jump */
function jump() {
  if (!dino.jumping) {
    dino.dy = -12;
    dino.jumping = true;
  }
}

/* Controls */
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Spacebar") {
    if (!running) startGame();
    jump();
  }
});

/* Start game */
function startGame() {
  running = true;
  score = 0;
  obstacles = [];
  dino.y = 200;
  dino.dy = 0;
  document.getElementById("startScreen").style.display = "none";
}

document.getElementById("startBtn").onclick = startGame;

update();
</script>

</body>
</html>
