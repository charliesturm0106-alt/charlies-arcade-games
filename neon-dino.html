<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Neon Dino Run</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Press Start 2P', sans-serif;
    color: #0ff;
    height: 100vh;
    background: linear-gradient(135deg, #000 0%, #001133 50%, #000 100%);
    background-size: 300% 300%;
    animation: bgMove 10s ease infinite;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Neon particles */
  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #0ff;
    box-shadow: 0 0 10px #0ff;
    border-radius: 50%;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
  }

  canvas {
    display: block;
    margin: auto;
    margin-top: 40px;
    background: transparent;
    border: 4px solid #0ff;
    box-shadow: 0 0 25px #0ff, 0 0 50px #0ff inset;
  }

  .score-box {
    text-align: center;
    margin-top: 20px;
    font-size: 12px;
    text-shadow: 0 0 10px #f0f;
  }

  .start-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.8);
    color: #0ff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-shadow: 0 0 10px #0ff;
  }

  .btn {
    margin-top: 10px;
    padding: 8px 14px;
    border: 2px solid #0ff;
    background: rgba(0,0,0,0.5);
    box-shadow: 0 0 10px #0ff;
    cursor: pointer;
    font-size: 10px;
  }

  .btn:hover {
    background: rgba(0,255,255,0.2);
  }
</style>
</head>

<body>

<div class="particles"></div>

<div class="start-screen" id="startScreen">
  <h1>NEON DINO RUN</h1>
  <p>Press SPACE to jump</p>
  <p>Press START to begin</p>
  <div class="btn" id="startBtn">START</div>
</div>

<canvas id="game" width="800" height="300"></canvas>

<div class="score-box">
  Score: <span id="score">0</span>  
  | High Score: <span id="highscore">0</span>
</div>

<script>
/* Neon particles */
const particleContainer = document.querySelector('.particles');
for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 5 + 's';
  particleContainer.appendChild(p);
}

/* Canvas setup */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let dino = {
  x: 50,
  y: 200,
  width: 40,
  height: 40,
  dy: 0,
  jumping: false
};

let obstacles = [];
let score = 0;
let highscore = localStorage.getItem("hs_dino") || 0;
document.getElementById("highscore").innerText = highscore;

let running = false;

/* Draw neon dino */
function drawDino() {
  ctx.fillStyle = "#0ff";
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 20;
  ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
}

/* Draw neon obstacle */
function drawObstacle(o) {
  ctx.fillStyle = "#f0f";
  ctx.shadowColor = "#f0f";
  ctx.shadowBlur = 20;
  ctx.fillRect(o.x, o.y, o.width, o.height);
}

/* Game loop */
function update() {
  if (!running) return requestAnimationFrame(update);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Dino gravity
  dino.y += dino.dy;
  dino.dy += 0.6;

  // Ground collision
  if (dino.y > 200) {
    dino.y = 200;
    dino.dy = 0;
    dino.jumping = false;
  }

  drawDino();

  // Spawn obstacles
  if (Math.random() < 0.02) {
    obstacles.push({
      x: 800,
      y: 220,
      width: 30,
      height: 30
    });
  }

  // Move obstacles
  obstacles.forEach(o => {
    o.x -= 6;
    drawObstacle(o);

    // Collision
    if (
      dino.x < o.x + o.width &&
      dino.x + dino.width > o.x &&
      dino.y < o.y + o.height &&
      dino.y + dino.height > o.y
    ) {
      running = false;
      localStorage.setItem("hs_dino", highscore);
      document.getElementById("startScreen").style.display = "flex";
    }
  });

  // Remove off-screen obstacles
  obstacles = obstacles.filter(o => o.x > -50);

  // Score
  score++;
  document.getElementById("score").innerText = score;

  if (score > highscore) {
    highscore = score;
    document.getElementById("highscore").innerText = highscore;
  }

  requestAnimationFrame(update);
}

/* Jump */
function jump() {
  if (!dino.jumping) {
    dino.dy = -12;
    dino.jumping = true;
  }
}

/* Controls */
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Spacebar") {
    if (!running) startGame();
    jump();
  }
});

/* Start game */
function startGame() {
  running = true;
  score = 0;
  obstacles = [];
  dino.y = 200;
  dino.dy = 0;
  document.getElementById("startScreen").style.display = "none";
}

document.getElementById("startBtn").onclick = startGame;

update();
</script>

</body>
</html>
