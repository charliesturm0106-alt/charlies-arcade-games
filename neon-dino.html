<!DOCTYPE html>
<html>
<head>
  <title>Neon Dino</title>
  <style>
    body { background:#000; overflow:hidden; }
    canvas { background:#111; border:4px solid #0ff; display:block; margin:auto; }
  </style>
</head>
<body>

<canvas id="game" width="800" height="200"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let dino = { x:50, y:150, width:40, height:40, dy:0, jumping:false };
let obstacles = [];
let speed = 6;

function drawDino() {
  ctx.fillStyle = "#0ff";
  ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
}

function drawObstacles() {
  ctx.fillStyle = "#f0f";
  obstacles.forEach(o => ctx.fillRect(o.x, o.y, o.width, o.height));
}

function updateObstacles() {
  if (Math.random() < 0.02) {
    obstacles.push({ x:800, y:160, width:20, height:40 });
  }
  obstacles.forEach(o => o.x -= speed);
  obstacles = obstacles.filter(o => o.x + o.width > 0);
}

function jump() {
  if (!dino.jumping) {
    dino.dy = -12;
    dino.jumping = true;
  }
}

function updateDino() {
  dino.y += dino.dy;
  dino.dy += 0.6;

  if (dino.y >= 150) {
    dino.y = 150;
    dino.dy = 0;
    dino.jumping = false;
  }
}

function checkCollision() {
  for (let o of obstacles) {
    if (dino.x < o.x + o.width &&
        dino.x + dino.width > o.x &&
        dino.y < o.y + o.height &&
        dino.y + dino.height > o.y) {
      alert("Game Over");
      obstacles = [];
      speed = 6;
    }
  }
}

function loop() {
  ctx.clearRect(0,0,800,200);
  drawDino();
  drawObstacles();
  updateDino();
  updateObstacles();
  checkCollision();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", jump);

loop();
</script>

</body>
</html>
