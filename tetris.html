<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Neon Tetris Deluxe</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Press Start 2P', sans-serif;
    color: #0ff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center,
      #001a33 0%,
      #000d1a 20%,
      #000 40%,
      #001a33 60%,
      #000d1a 80%,
      #000 100%
    );
    background-size: 200% 200%;
    animation: neonPulse 6s ease-in-out infinite;
  }

  @keyframes neonPulse {
    0%   { background-position: 0% 0%; filter: brightness(1); }
    50%  { background-position: 100% 100%; filter: brightness(1.4); }
    100% { background-position: 0% 0%; filter: brightness(1); }
  }

  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #0ff;
    box-shadow: 0 0 10px #0ff;
    border-radius: 50%;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
  }

  .neon-sweep {
    position: absolute;
    top: 0;
    left: -200%;
    width: 400%;
    height: 100%;
    background: linear-gradient(90deg, transparent, #0ff3, transparent);
    animation: sweep 4s linear infinite;
    pointer-events: none;
  }

  @keyframes sweep {
    0% { transform: translateX(0); }
    100% { transform: translateX(200%); }
  }

  .score-box {
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #f0f;
    z-index: 2;
  }

  canvas {
    background: transparent;
    border: 4px solid #0ff;
    box-shadow: 0 0 25px #0ff, 0 0 50px #0ff inset;
    z-index: 2;
  }

  .grid-glow {
    position: absolute;
    width: 240px;
    height: 400px;
    pointer-events: none;
    background-image:
      linear-gradient(#0ff5, #0ff5),
      linear-gradient(#0ff5, #0ff5);
    background-size: 20px 2px, 2px 20px;
    background-repeat: repeat;
    opacity: 0.3;
    filter: blur(2px);
    z-index: 1;
  }

  .ui-bar {
    margin-top: 8px;
    font-size: 10px;
    text-align: center;
    color: #fff;
    text-shadow: 0 0 6px #0ff;
  }

  .btn {
    display: inline-block;
    margin: 0 6px;
    padding: 4px 8px;
    border: 2px solid #0ff;
    border-radius: 4px;
    cursor: pointer;
    font-size: 8px;
    text-transform: uppercase;
    background: rgba(0,0,0,0.6);
    box-shadow: 0 0 10px #0ff;
  }

  .btn:hover {
    background: rgba(0,255,255,0.2);
  }

  .start-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.8);
    color: #0ff;
    text-align: center;
    z-index: 5;
  }

  .start-screen h1 {
    font-size: 18px;
    text-shadow: 0 0 12px #0ff;
    margin-bottom: 12px;
  }

  .start-screen p {
    font-size: 10px;
    margin-bottom: 10px;
  }

  .explosion {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle, #fff, #ff0, #f00, transparent);
    animation: explode 0.4s ease-out forwards;
    z-index: 4;
  }

  @keyframes explode {
    0% { transform: scale(0.2); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .enemy {
    position: absolute;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: #f0f;
    box-shadow: 0 0 12px #f0f;
    animation: enemyMove 10s linear infinite;
    opacity: 0.6;
    pointer-events: none;
  }

  @keyframes enemyMove {
    0% { transform: translateX(-10vw) translateY(10vh); }
    50% { transform: translateX(110vw) translateY(50vh); }
    100% { transform: translateX(-10vw) translateY(90vh); }
  }
</style>
</head>

<body>

<div class="particles"></div>
<div class="neon-sweep"></div>

<div class="score-box">
  <h2>NEON TETRIS</h2>
  <div>Score: <span id="score">0</span></div>
  <div class="ui-bar">
    <span class="btn" id="btn-start">Start</span>
    <span class="btn" id="btn-music">Music: Off</span>
    <span class="btn" id="btn-rainbow">Rainbow: Off</span>
  </div>
</div>

<div style="position:relative;">
  <canvas id="tetris" width="240" height="400"></canvas>
  <div class="grid-glow"></div>
</div>

<div class="start-screen" id="start-screen">
  <h1>NEON TETRIS</h1>
  <p>← → move | ↑ rotate | ↓ drop</p>
  <p>Press START or SPACE to begin</p>
  <span class="btn" id="start-btn-main">Start Game</span>
</div>

<script>
/* Neon particles */
const particleContainer = document.querySelector('.particles');
for (let i = 0; i < 30; i++) {
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 5 + 's';
  particleContainer.appendChild(p);
}
for (let i = 0; i < 20; i++) {
  const dust = document.createElement('div');
  dust.classList.add('particle');
  dust.style.width = '3px';
  dust.style.height = '3px';
  dust.style.background = '#f0f';
  dust.style.boxShadow = '0 0 6px #f0f';
  dust.style.left = Math.random() * 100 + 'vw';
  dust.style.animationDuration = (3 + Math.random() * 3) + 's';
  particleContainer.appendChild(dust);
}

/* Background enemies */
for (let i = 0; i < 4; i++) {
  const e = document.createElement('div');
  e.classList.add('enemy');
  e.style.top = (10 + i * 20) + 'vh';
  e.style.animationDelay = (i * 2) + 's';
  document.body.appendChild(e);
}

/* Audio */
let musicOn = false;
let rainbowOn = false;
const music = new Audio("https://actions.google.com/sounds/v1/ambiences/space_wind.ogg");
music.loop = true;

const sfxLine = new Audio("https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg");
const sfxDrop = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

/* Tetris engine */
const canvas = document.getElementById("tetris");
const ctx = canvas.getContext("2d");
ctx.scale(20, 20);

let colorsBase = [
  null,
  "#00ffff",
  "#ff00ff",
  "#ffff00",
  "#00ff00",
  "#ff8800",
  "#0088ff",
  "#ffffff"
];

function getColors() {
  if (!rainbowOn) return colorsBase;
  return [
    null,
    "#ff0000",
    "#ff7f00",
    "#ffff00",
    "#00ff00",
    "#0000ff",
    "#4b0082",
    "#8f00ff"
  ];
}

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

function createPiece(type) {
  if (type === "T") return [[0,1,0],[1,1,1],[0,0,0]];
  if (type === "O") return [[2,2],[2,2]];
  if (type === "L") return [[0,0,3],[3,3,3],[0,0,0]];
  if (type === "J") return [[4,0,0],[4,4,4],[0,0,0]];
  if (type === "I") return [[0,0,0,0],[5,5,5,5],[0,0,0,0]];
  if (type === "S") return [[0,6,6],[6,6,0],[0,0,0]];
  if (type === "Z") return [[7,7,0],[0,7,7],[0,0,0]];
}

function drawMatrix(matrix, offset) {
  const colors = getColors();
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        ctx.fillStyle = colors[value];
        ctx.shadowColor = colors[value];
        ctx.shadowBlur = 20;
        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawMatrix(arena, {x: 0, y: 0});
  drawMatrix(player.matrix, player.pos);
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        arena[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

function collide(arena, player) {
  const [m, o] = [player.matrix, player.pos];
  for (let y = 0; y < m.length; y++) {
    for (let x = 0; x < m[y].length; x++) {
      if (m[y][x] !== 0 &&
          (arena[y + o.y] &&
           arena[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function spawnExplosion(y) {
  const rect = canvas.getBoundingClientRect();
  const ex = rect.left + rect.width / 2;
  const ey = rect.top + (y / arena.length) * rect.height;
  const boom = document.createElement('div');
  boom.classList.add('explosion');
  boom.style.left = (ex - 20) + 'px';
  boom.style.top = (ey - 20) + 'px';
  document.body.appendChild(boom);
  setTimeout(() => boom.remove(), 400);
}

function arenaSweep() {
  let rowCount = 1;
  outer: for (let y = arena.length - 1; y >= 0; y--) {
    for (let x = 0; x < arena[y].length; x++) {
      if (arena[y][x] === 0) continue outer;
    }
    arena.splice(y, 1);
    arena.unshift(new Array(12).fill(0));
    player.score += rowCount * 100;
    rowCount *= 2;
    spawnExplosion(y);
    sfxLine.currentTime = 0;
    sfxLine.play();
  }
  document.getElementById("score").innerText = player.score;
  localStorage.setItem("hs_tetris", player.score);
}

function playerReset() {
  const pieces = "TJLOSZI";
  player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
  player.pos.y = 0;
  player.pos.x = (12 / 2 | 0) - (player.matrix[0].length / 2 | 0);

  if (collide(arena, player)) {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    document.getElementById("score").innerText = player.score;
  }
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < y; x++) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate(dir) {
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
}

function playerDrop() {
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    arenaSweep();
    playerReset();
  }
  dropCounter = 0;
}

let dropCounter = 0;
let lastTime = 0;
let running = false;

function update(time = 0) {
  if (!running) {
    requestAnimationFrame(update);
    return;
  }
  const delta = time - lastTime;
  lastTime = time;
  dropCounter += delta;
  if (dropCounter > 500) playerDrop();
  draw();
  requestAnimationFrame(update);
}

document.addEventListener("keydown", e => {
  if (!running && (e.key === " " || e.key === "Spacebar")) {
    startGame();
    return;
  }
  e.preventDefault();
  if (!running) return;
  if (e.key === "ArrowLeft") playerMove(-1);
  else if (e.key === "ArrowRight") playerMove(1);
  else if (e.key === "ArrowDown") {
    playerDrop();
    sfxDrop.currentTime = 0;
    sfxDrop.play();
  }
  else if (e.key === "ArrowUp") playerRotate(1);
});

function playerMove(dir) {
  player.pos.x += dir;
  if (collide(arena, player)) player.pos.x -= dir;
}

const arena = createMatrix(12, 20);
const player = {
  pos: {x: 0, y: 0},
  matrix: null,
  score: 0
};

playerReset();
update();

/* UI buttons */
const btnStart = document.getElementById("btn-start");
const btnMusic = document.getElementById("btn-music");
const btnRainbow = document.getElementById("btn-rainbow");
const startScreen = document.getElementById("start-screen");
const startBtnMain = document.getElementById("start-btn-main");

function startGame() {
  running = true;
  startScreen.style.display = "none";
}

btnStart.addEventListener("click", startGame);
startBtnMain.addEventListener("click", startGame);

btnMusic.addEventListener("click", () => {
  musicOn = !musicOn;
  btnMusic.textContent = "Music: " + (musicOn ? "On" : "Off");
  if (musicOn) {
    music.currentTime = 0;
    music.play();
  } else {
    music.pause();
  }
});

btnRainbow.addEventListener("click", () => {
  rainbowOn = !rainbowOn;
  btnRainbow.textContent = "Rainbow: " + (rainbowOn ? "On" : "Off");
});
</script>

</body>
</html>
