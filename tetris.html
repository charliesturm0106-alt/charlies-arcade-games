<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Neon Tetris</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: 'Press Start 2P', sans-serif;
    color: #0ff;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* Animated neon gradient */
    background: linear-gradient(135deg, #000 0%, #001133 50%, #000 100%);
    background-size: 400% 400%;
    animation: neonBG 12s ease infinite;
  }

  @keyframes neonBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* Floating neon particles */
  .particles {
    position: absolute;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #0ff;
    box-shadow: 0 0 10px #0ff;
    border-radius: 50%;
    animation: floatUp 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10vh); }
  }

  /* Score box */
  .score-box {
    text-align: center;
    margin-bottom: 10px;
    text-shadow: 0 0 10px #f0f;
  }

  /* Canvas glow */
  canvas {
    background: #000;
    border: 4px solid #0ff;
    box-shadow: 0 0 25px #0ff, 0 0 50px #0ff inset;
  }

  /* Neon grid overlay */
  .grid-glow {
    position: absolute;
    width: 240px;
    height: 400px;
    pointer-events: none;
    background-image:
      linear-gradient(#0ff3, #0ff3),
      linear-gradient(#0ff3, #0ff3);
    background-size: 20px 2px, 2px 20px;
    background-repeat: repeat;
    opacity: 0.15;
    filter: blur(1px);
  }
</style>
</head>

<body>

<!-- Neon particles -->
<div class="particles"></div>

<div class="score-box">
  <h2>NEON TETRIS</h2>
  <div>Score: <span id="score">0</span></div>
</div>

<div style="position:relative;">
  <canvas id="tetris" width="240" height="400"></canvas>
  <div class="grid-glow"></div>
</div>

<script>
/* Generate neon particles */
const particleContainer = document.querySelector('.particles');
for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.classList.add('particle');
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDelay = Math.random() * 5 + 's';
  particleContainer.appendChild(p);
}

/* Tetris engine */
const canvas = document.getElementById("tetris");
const ctx = canvas.getContext("2d");
ctx.scale(20, 20);

const colors = [
  null,
  "#00ffff",
  "#ff00ff",
  "#ffff00",
  "#00ff00",
  "#ff8800",
  "#0088ff",
  "#ffffff"
];

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

function createPiece(type) {
  if (type === "T") return [[0,1,0],[1,1,1],[0,0,0]];
  if (type === "O") return [[2,2],[2,2]];
  if (type === "L") return [[0,0,3],[3,3,3],[0,0,0]];
  if (type === "J") return [[4,0,0],[4,4,4],[0,0,0]];
  if (type === "I") return [[0,0,0,0],[5,5,5,5],[0,0,0,0]];
  if (type === "S") return [[0,6,6],[6,6,0],[0,0,0]];
  if (type === "Z") return [[7,7,0],[0,7,7],[0,0,0]];
}

function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        ctx.fillStyle = colors[value];
        ctx.shadowColor = colors[value];
        ctx.shadowBlur = 20;
        ctx.fillRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  drawMatrix(arena, {x: 0, y: 0});
  drawMatrix(player.matrix, player.pos);
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        arena[y + player.pos.y][x + player.pos.x] = value;
      }
    });
  });
}

function collide(arena, player) {
  const [m, o] = [player.matrix, player.pos];
  for (let y = 0; y < m.length; y++) {
    for (let x = 0; x < m[y].length; x++) {
      if (m[y][x] !== 0 &&
          (arena[y + o.y] &&
           arena[y + o.y][x + o.x]) !== 0) {
        return true;
      }
    }
  }
  return false;
}

function arenaSweep() {
  let rowCount = 1;
  outer: for (let y = arena.length - 1; y >= 0; y--) {
    for (let x = 0; x < arena[y].length; x++) {
      if (arena[y][x] === 0) continue outer;
    }
    arena.splice(y, 1);
    arena.unshift(new Array(12).fill(0));
    player.score += rowCount * 100;
    rowCount *= 2;
  }
  document.getElementById("score").innerText = player.score;
  localStorage.setItem("hs_tetris", player.score);
}

function playerReset() {
  const pieces = "TJLOSZI";
  player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
  player.pos.y = 0;
  player.pos.x = (12 / 2 | 0) - (player.matrix[0].length / 2 | 0);

  if (collide(arena, player)) {
    arena.forEach(row => row.fill(0));
    player.score = 0;
    document.getElementById("score").innerText = player.score;
  }
}

function rotate(matrix, dir) {
  for (let y = 0; y < matrix.length; y++) {
    for (let x = 0; x < y; x++) {
      [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
    }
  }
  if (dir > 0) matrix.forEach(row => row.reverse());
  else matrix.reverse();
}

function playerRotate(dir) {
  const pos = player.pos.x;
  let offset = 1;
  rotate(player.matrix, dir);
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > player.matrix[0].length) {
      rotate(player.matrix, -dir);
      player.pos.x = pos;
      return;
    }
  }
}

function playerDrop() {
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    merge(arena, player);
    arenaSweep();
    playerReset();
  }
  dropCounter = 0;
}

let dropCounter = 0;
let lastTime = 0;

function update(time = 0) {
  const delta = time - lastTime;
  lastTime = time;
  dropCounter += delta;
  if (dropCounter > 500) playerDrop();
  draw();
  requestAnimationFrame(update);
}

document.addEventListener("keydown", e => {
  e.preventDefault();
  if (e.key === "ArrowLeft") playerMove(-1);
  else if (e.key === "ArrowRight") playerMove(1);
  else if (e.key === "ArrowDown") playerDrop();
  else if (e.key === "ArrowUp") playerRotate(1);
});

function playerMove(dir) {
  player.pos.x += dir;
  if (collide(arena, player)) player.pos.x -= dir;
}

const arena = createMatrix(12, 20);
const player = {
  pos: {x: 0, y: 0},
  matrix: null,
  score: 0
};

playerReset();
update();
</script>

</body>
</html>
